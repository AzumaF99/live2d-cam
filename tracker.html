<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live2D Cam トラッカー（iPhone用）</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #14161e; color: #e9ecf3; font-family: system-ui, "Hiragino Sans", sans-serif; }
  main { padding: 16px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  #status { padding: 10px 12px; border-radius: 10px; background: #2a2f3d; font-size: 15px; margin-bottom: 12px; }
  #status.ok { background: #1f5d3a; }
  #status.ng { background: #6b2a2a; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 20px; padding: 10px; border-radius: 10px; border: 1px solid #444b5e; background: #0f1117; color: #fff; letter-spacing: 3px; text-align: center; }
  button { width: 100%; font-size: 17px; padding: 14px; border: 0; border-radius: 12px; background: #4c6fff; color: #fff; margin-top: 10px; }
  button.sub { background: #3a4052; }
  button:disabled { opacity: .5; }
  video { width: 100%; border-radius: 12px; margin-top: 12px; transform: scaleX(-1); background: #000; }
  video.hidden { display: none; }
  .hint { color: #9aa3b8; font-size: 12px; line-height: 1.6; margin-top: 10px; }
  #meter { font-size: 12px; color: #9aa3b8; margin-top: 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Live2D Cam トラッカー</h1>
  <div id="status">ルームコードを入れて「開始」を押してください</div>
  <input type="text" id="room" placeholder="ルームコード" autocapitalize="none" autocomplete="off" autocorrect="off">
  <button id="start">開始</button>
  <button id="calib" class="sub" disabled>正面をリセット（まっすぐ向いて押す）</button>
  <button id="togglePreview" class="sub" disabled>プレビューを隠す（節電）</button>
  <video id="video" playsinline muted autoplay></video>
  <div id="meter"></div>
  <div class="hint">
    ・映像は端末内で処理され、送信されるのは顔の向きなどの数値だけです。<br>
    ・Safariを前面に出したままにしてください（他のアプリに切り替えると止まります）。<br>
    ・顔が明るく映る位置に置くと精度が上がります。
  </div>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const q = new URLSearchParams(location.search);
$('room').value = (q.get('room') || '').toLowerCase();

let landmarker = null, peer = null, conn = null, running = false;
let offset = { yaw: 0, pitch: 0, roll: 0 }, last = { yaw: 0, pitch: 0, roll: 0 };
let sent = 0, lastMeter = 0, lastVideoTime = -1;

function setStatus(text, cls) { const el = $('status'); el.textContent = text; el.className = cls || ''; }
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const DEG = 180 / Math.PI;

async function createLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const make = (delegate) => FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO", numFaces: 1,
    outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true
  });
  try { return await make("GPU"); } catch (e) { console.warn("GPU不可、CPUで実行", e); return await make("CPU"); }
}

function connect(room) {
  if (peer) { try { peer.destroy(); } catch (e) {} }
  peer = new Peer();
  const dial = () => {
    if (!running || !peer || peer.destroyed) return;
    conn = peer.connect('live2dcam-' + room, { reliable: false, serialization: 'json' });
    const retry = setTimeout(() => { if (!conn || !conn.open) { try { conn.close(); } catch (e) {} dial(); } }, 6000);
    conn.on('open', () => { clearTimeout(retry); setStatus('PCと接続中。顔を映してください', 'ok'); });
    conn.on('close', () => { clearTimeout(retry); setStatus('PCとの接続が切れました。再接続中…', 'ng'); setTimeout(dial, 1500); });
  };
  peer.on('open', dial);
  peer.on('disconnected', () => setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 2000));
  peer.on('error', (err) => {
    console.warn(err);
    if (err && err.type === 'peer-unavailable') setStatus('PC側のビューアが見つかりません。PCでページを開き、コードを確認してください', 'ng');
  });
}

function process(res) {
  const out = { face: false };
  const bs = res.faceBlendshapes && res.faceBlendshapes[0];
  const mt = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
  if (!bs || !mt) return out;
  out.face = true;

  // 顔の回転（列優先の4x4行列）→ 角度
  const m = mt.data;
  const yaw = Math.atan2(m[8], m[10]) * DEG;
  const pitch = Math.asin(clamp(-m[9], -1, 1)) * DEG;
  const roll = Math.atan2(m[1], m[5]) * DEG;
  last = { yaw, pitch, roll };
  out.ax = yaw - offset.yaw;
  out.ay = -(pitch - offset.pitch);
  out.az = -(roll - offset.roll);

  const b = {};
  for (const c of bs.categories) b[c.categoryName] = c.score;
  const v = (k) => b[k] || 0;

  out.el = clamp(1 - (v('eyeBlinkLeft') - 0.15) / 0.45, 0, 1);
  out.er = clamp(1 - (v('eyeBlinkRight') - 0.15) / 0.45, 0, 1);
  out.ex = clamp(((v('eyeLookOutLeft') - v('eyeLookInLeft')) + (v('eyeLookInRight') - v('eyeLookOutRight'))) / 2 * 1.6, -1, 1);
  out.ey = clamp(((v('eyeLookUpLeft') - v('eyeLookDownLeft')) + (v('eyeLookUpRight') - v('eyeLookDownRight'))) / 2 * 1.6, -1, 1);
  out.mo = clamp((v('jawOpen') - 0.03) * 2.2, 0, 1);
  const smile = (v('mouthSmileLeft') + v('mouthSmileRight')) / 2;
  const frown = (v('mouthFrownLeft') + v('mouthFrownRight')) / 2;
  out.mf = clamp(smile * 2 - frown * 2.5 - v('mouthPucker') * 0.6, -1, 1);
  out.bl = clamp((v('browInnerUp') + v('browOuterUpLeft')) - v('browDownLeft') * 1.5, -1, 1);
  out.br = clamp((v('browInnerUp') + v('browOuterUpRight')) - v('browDownRight') * 1.5, -1, 1);
  for (const k of Object.keys(out)) if (typeof out[k] === 'number') out[k] = Math.round(out[k] * 1000) / 1000;
  return out;
}

function loop() {
  if (!running) return;
  const video = $('video');
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    let res = null;
    try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { console.warn(e); }
    if (res) {
      const data = process(res);
      if (conn && conn.open) { try { conn.send(data); sent++; } catch (e) {} }
      const now = performance.now();
      if (now - lastMeter > 1000) {
        $('meter').textContent = (data.face ? '顔を認識中' : '顔が見つかりません') + ' / 送信 ' + sent + ' 回/秒';
        sent = 0; lastMeter = now;
      }
    }
  }
  requestAnimationFrame(loop);
}

async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) keepAwake(); });

$('start').addEventListener('click', async () => {
  const room = $('room').value.trim().toLowerCase();
  if (!room) { setStatus('ルームコードを入力してください', 'ng'); return; }
  $('start').disabled = true;
  try {
    setStatus('カメラを起動中…');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    setStatus('顔認識の準備中…（初回は少し時間がかかります）');
    landmarker = await createLandmarker();
    running = true;
    $('calib').disabled = false; $('togglePreview').disabled = false;
    keepAwake();
    setStatus('PCに接続中…');
    connect(room);
    loop();
  } catch (e) {
    console.error(e);
    $('start').disabled = false;
    setStatus(e && e.name === 'NotAllowedError'
      ? 'カメラが許可されていません。Safariの設定でカメラを許可してください'
      : '開始できませんでした: ' + (e && e.message ? e.message : e), 'ng');
  }
});

$('calib').addEventListener('click', () => { offset = { ...last }; });
$('togglePreview').addEventListener('click', () => {
  const hidden = $('video').classList.toggle('hidden');
  $('togglePreview').textContent = hidden ? 'プレビューを表示' : 'プレビューを隠す（節電）';
});
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</body>
</html>
